# Most tasks are a single `go ...` invocation and run unchanged under both the
# POSIX shell and the "cmd /c" that mise defaults to on Windows. Tasks relying on
# POSIX syntax declare `shell = "bash -c"` explicitly — the global
# `windows_default_inline_shell_args` setting is refused from a project config.

[tools]
go = "1.27"
# Pinned so CI and every machine lint against the same rules. Without a pin, two
# golangci-lint versions disagree on what Rule 305 considers a clean run.
# 2.15.0 is the first line built with Go 1.27 (2.12.2 was built with go1.26 and
# refuses a go.mod that targets 1.27: "Go language version used to build
# golangci-lint is lower than the targeted Go version").
golangci-lint = "2.15.0"
# Pinned for the same reason, and it matters more here: goreleaser's own
# configuration schema changes between minor versions, so an unpinned tool
# would fail on `version: 2` syntax that was valid when it was written.
goreleaser = "2.18.0"
# Pinned for the same reason as the two above. Used by docs-serve/docs-build
# to run mkdocs-material without installing it as a mise tool: mkdocs-material
# is a theme/plugin package, not an app — it exposes no console-script entry
# point of its own (only its dependency `mkdocs` does), so `pipx:mkdocs-material`
# fails on every platform with "No executables are provided by package
# `mkdocs-material`". `uv tool run --with` sidesteps this by running `mkdocs`
# (which has an entry point) in an ephemeral environment with mkdocs-material
# injected alongside it.
uv = "0.12.10"
# Pinned for the same reason. It is installed in the `Test` job so that
# TestARealKustomizeIsNotStartedOnAPluginDirectory (internal/scan), which skips
# without kubeconform on PATH, runs there (DEVDESK-771 follow-up). mise verifies
# the release checksum through its aqua registry.
kubeconform = "0.8.0"

[tasks.build]
description = "Build the binary to bin/dk"
# `$(go env GOEXE)` for the same reason as [tasks.install]: `-o` takes the name
# literally, and PowerShell refuses to run an extension-less file even by
# explicit path — "Cannot run a document in the middle of a pipeline". Only
# `mise run run` uses this binary today, and it goes through bash, which is why
# nothing has complained. Empty on every other platform.
#
# Seule la version passe par -ldflags. Le commit et la date viennent des
# métadonnées que `-buildvcs=auto` embarque tout seul, et que
# `internal/version` lit en repli : les poser ici aussi serait une seconde
# source pour une réponse que le compilateur donne déjà. `git describe` sans
# `--always` échoue tant qu'aucun tag n'existe, et c'est voulu — un SHA promu
# au rang de numéro de version est pire que "dev".
shell = "bash -c"
run = '''
version=$(git describe --tags --dirty 2>/dev/null || echo dev)
go build -ldflags "-X github.com/anthnel/devdesk/internal/version.version=$version" -o "bin/dk$(go env GOEXE)" .
'''

[tasks.run]
description = "Build and run the application"
depends = ["build"]
shell = "bash -c"
run = './bin/dk$(go env GOEXE)'

[tasks.dev]
description = "Run directly with go run (faster for development)"
run = "go run ."

[tasks.setup]
description = "Run the `dk setup` context wizard directly with go run"
run = "go run . setup"

[tasks.test]
description = "Run all tests"
run = "go test -v ./..."

[tasks.test-race]
description = "Run tests with race detector (requires a C toolchain: gcc/clang)"
env = { CGO_ENABLED = "1" }
run = "go test -race ./..."

[tasks.engine-survey]
description = "List the tests that reach a real container engine (guard G1, survey mode, DEVDESK-798): runs the whole suite once, which is heavy, and prints each (test, operation, binary) outside a fakecli directory; never part of ci, check or test"
shell = "bash -c"
# A failing package must not hide the list, so the run is not allowed to stop the
# task; the file is temporary and removed whatever happens.
run = """
survey="$(mktemp)"
trap 'rm -f "$survey"' EXIT
DEVDESK_ENGINE_SURVEY="$survey" go test -count=1 ./... || echo "engine-survey: some packages failed; the list covers what ran" >&2
go run ./internal/engineguard/cmd/engine-survey "$survey"
"""

[tasks.cover]
description = "Run tests and report coverage per package"
run = "go test -cover ./..."

[tasks.fmt]
description = "Format code"
run = "go fmt ./..."

[tasks.fmt-check]
description = "Fail when a file is not gofmt-clean (fmt rewrites, this one reports)"
shell = "bash -c"
run = """
unformatted=$(gofmt -l .)
if [ -n "$unformatted" ]; then
  echo "not gofmt-clean:"
  echo "$unformatted"
  exit 1
fi
"""

# vet and lint run twice: for the host platform, then cross-compiled for Windows
# (DEVDESK-486). internal/nettrace and internal/ui/netdiag carry *_windows.go
# files that a Linux or macOS run never type-checks, so a break there would only
# show up on a Windows machine. `env` on a sub-task sets GOOS without any shell
# syntax, which keeps it identical under bash on CI and cmd on Windows. The ci
# task and ci.yml keep calling `vet` and `lint`, so their step lists are unchanged.
[tasks.vet]
description = "Run go vet for the host platform and for Windows (cross-compiled)"
run = [
  { task = "vet-host" },
  { task = "vet-windows" },
]

[tasks.vet-host]
description = "Run go vet for the host platform"
run = "go vet ./..."

[tasks.vet-windows]
description = "Run go vet cross-compiled for Windows"
env = { GOOS = "windows" }
run = "go vet ./..."

[tasks.lint]
description = "Run golangci-lint for the host platform and for Windows (cross-compiled)"
run = [
  { task = "lint-host" },
  { task = "lint-windows" },
]

[tasks.lint-host]
description = "Run golangci-lint for the host platform"
run = "golangci-lint run"

[tasks.lint-windows]
description = "Run golangci-lint cross-compiled for Windows"
env = { GOOS = "windows" }
run = "golangci-lint run"

[tasks.tidy]
description = "Tidy dependencies"
run = "go mod tidy"

[tasks.deps]
description = "Download dependencies"
run = "go mod download"

[tasks.clean]
description = "Clean build artifacts"
shell = "bash -c"
run = """
rm -rf bin
go clean
"""

[tasks.install]
description = "Install the dk binary to $GOPATH/bin"
# Two things a bare `go install` gets wrong here. It names the binary after the
# module (`devdesk`), while the command — and `mise run build` — is `dk`; and
# mise's go plugin exports GOBIN=<mise>/installs/go/<version>/bin, so the binary
# would land in a directory that disappears on the next toolchain bump.
#
# `go env GOEXE` is what `go install` would have appended, and dropping it is not
# cosmetic on Windows: `-o` takes the name literally, so the file lands as `dk`
# with no extension. It is a valid PE and runs by explicit path — which is why
# `mise run run` never noticed — but PowerShell and cmd resolve a bare command
# through PATHEXT, so `dk` is simply not found. GOEXE is empty everywhere else.
#
# The destination is printed rather than tested. Whether `dk` will resolve is a
# question about the *calling* shell's PATH, and this task runs under bash: a
# check here would answer for the wrong shell and be believed. Saying where the
# binary went lets the reader answer it themselves, which is the one thing a
# "command not found" a second later does not tell them.
shell = "bash -c"
run = """
target="$(go env GOPATH)/bin/dk$(go env GOEXE)"
version=$(git describe --tags --dirty 2>/dev/null || echo dev)
go build -ldflags "-X github.com/anthnel/devdesk/internal/version.version=$version" -o "$target" .
echo "installed $target"
echo "run it as 'dk' once $(dirname "$target") is on PATH"
"""

[tasks.release-check]
description = "Validate .goreleaser.yaml without building anything"
run = "goreleaser check"

[tasks.release]
description = "Build the release artifacts and attach them to the GitHub Release (CI only)"
# Needs GITHUB_TOKEN and a tag; it is the release workflow's build step, and
# running it by hand would publish. `release-snapshot` is the local equivalent.
run = "goreleaser release --clean"

[tasks.release-snapshot]
description = "Build the release artifacts locally, publishing nothing"
# `--snapshot` is what makes this runnable without a tag: goreleaser invents a
# version rather than refusing. It is the only way to find out that a build
# target is broken before a tag has been pushed, which is the point at which
# the mistake is expensive.
run = "goreleaser release --snapshot --clean"

[tasks.check]
description = "Run fmt, vet, lint and tests (pre-commit checklist)"
depends = ["fmt", "vet", "lint", "test"]

[tasks.ci]
description = "Reproduce the CI locally: fmt-check, vet, lint, build, then test-race, in order, stopping at the first failure; test-race is the only test run (-race covers what go test does), `mise run test` stays available alone for the fast local loop; unlike check it rewrites no file (fmt-check, not fmt)"
# Sequential on purpose: `depends` would run the steps in parallel. The tests run
# once, under the race detector (DEVDESK-648): a separate `test` step only
# repeated the same suite. test-race fails plainly when no C compiler is
# installed; nothing is skipped or masked.
run = [
  { task = "fmt-check" },
  { task = "vet" },
  { task = "lint" },
  { task = "build" },
  { task = "test-race" },
]

[tasks.docs-serve]
description = "Preview the documentation site locally"
shell = "bash -c"
# Same changelog staging step as docs-build — without it, mkdocs.yml's nav
# points at a changelog.md that doesn't exist yet on a fresh checkout.
run = """
cp CHANGELOG.md docs-site/docs/changelog.md
uv tool run --with mkdocs-material==9.6.14 mkdocs serve -f docs-site/mkdocs.yml
"""

[tasks.docs-build]
description = "Build the static documentation site into docs-site/site"
shell = "bash -c"
# CHANGELOG.md is copied in rather than symlinked so the build works the same
# way locally and in CI, on every OS mise supports.
# --site-dir is resolved relative to the config file (-f), not the cwd: passing
# "docs-site/site" here built into docs-site/docs-site/site instead, so
# actions/upload-pages-artifact found nothing at docs-site/site in CI.
run = """
cp CHANGELOG.md docs-site/docs/changelog.md
uv tool run --with mkdocs-material==9.6.14 mkdocs build -f docs-site/mkdocs.yml --site-dir site
"""

[tasks.agentusage-ref]
description = "Write the ccusage reference file for internal/agentusage/crosscheck_test.go: mise run agentusage-ref -- <uuid>... > /path/outside/repo/ref.json (output outside the repo, never committed)"
# POSIX shell, npx and jq required, hence no Windows support. ccusage is pinned
# so the reference does not move under us. Its per-session JSON has a flat
# `totalTokens` plus an `entries` array carrying inputTokens, outputTokens,
# cacheReadTokens and cacheCreationTokens; ccusage's totalTokens is the sum of
# the four, which is what the crosscheck compares against. Only stdout is the
# reference: ccusage progress noise stays on stderr.
shell = "bash -c"
# mise appends trailing arguments to the script text rather than binding them to
# "$@", so the ids are declared with a usage spec and read from usage_ids.
usage = 'arg "<ids>" var=#true'
run = '''
set -euo pipefail
for id in $usage_ids; do
  npx --yes ccusage@20.0.43 claude session --id "$id" --json
done | jq -s '{sessions: map({
  id: .sessionId,
  total: .totalTokens,
  input: ([.entries[].inputTokens] | add // 0),
  output: ([.entries[].outputTokens] | add // 0),
  cacheRead: ([.entries[].cacheReadTokens] | add // 0),
  cacheWrite: ([.entries[].cacheCreationTokens] | add // 0)
})}'
'''

# The nexus-bench:* tasks (DEVDESK-504, docs/architecture/nexus-bench.md) drive a
# disposable Nexus on a real k0s cluster through kubectl: up, provision, down,
# seed, cut-upstream, restore-upstream, reset and status read or change that
# cluster, and the bench has to be reachable from this machine. They are NOT
# part of ci, check, test or test-race and nothing depends on them
# (mise_tasks_test.go checks it). Only render contacts nothing, and record
# (DEVDESK-511) reaches the bench through its loopback ports, not the cluster.
#
# kubectl is declared on each task that reaches the cluster rather than in
# [tools], so the CI does not install it; render and record reach no cluster and
# have none.
# seed (DEVDESK-505) also needs skopeo, which is a tool of the host: mise does
# not install it and the description of the task says so.
# The cluster (datomir) runs k0s v1.36.x and kubectl is supported within one
# minor version of the API server, so 1.35 is the oldest accepted here.
# Arguments go after `--`: mise appends them to the command, so
# `mise run nexus-bench:up -- --namespace nexus-bench-2` reaches the command.
# Every flag has a NEXUS_BENCH_* variable; see `nexus-bench <subcommand> -h`.

[tasks."nexus-bench:up"]
description = "Deploy the disposable Nexus bench and its upstream on the cluster, wait for it, provision it, seed the data set and write the descriptor (acts on the cluster; --accept-eula needed once; seeding needs skopeo on this machine)"
tools = { kubectl = "1.35" }
run = "go run ./internal/nexusbench/cmd/nexus-bench up"

[tasks."nexus-bench:provision"]
description = "Provision the running Nexus bench again (idempotent) and write the descriptor (acts on the cluster)"
tools = { kubectl = "1.35" }
run = "go run ./internal/nexusbench/cmd/nexus-bench provision"

[tasks."nexus-bench:down"]
description = "Delete the Nexus bench namespace and wait until it is gone (acts on the cluster)"
tools = { kubectl = "1.35" }
run = "go run ./internal/nexusbench/cmd/nexus-bench down"

[tasks."nexus-bench:seed"]
description = "Put the data set in the Nexus bench that up provisioned and write the descriptor (acts on the cluster; needs skopeo on this machine, which mise does not install)"
tools = { kubectl = "1.35" }
run = "go run ./internal/nexusbench/cmd/nexus-bench seed"

[tasks."nexus-bench:cut-upstream"]
description = "Scale the Nexus bench upstream to zero replicas and wait until no pod is left (acts on the cluster; the proxy then serves only what it cached)"
tools = { kubectl = "1.35" }
run = "go run ./internal/nexusbench/cmd/nexus-bench cut-upstream"

[tasks."nexus-bench:restore-upstream"]
description = "Bring the Nexus bench upstream back and put its proxy back in service (acts on the cluster; needs skopeo on this machine, which mise does not install)"
tools = { kubectl = "1.35" }
run = "go run ./internal/nexusbench/cmd/nexus-bench restore-upstream"

[tasks."nexus-bench:reset"]
description = "Delete the Docker repositories and the upstream storage of the Nexus bench, then provision and seed again, keeping the instance (acts on the cluster; needs skopeo on this machine, which mise does not install)"
tools = { kubectl = "1.35" }
run = "go run ./internal/nexusbench/cmd/nexus-bench reset"

[tasks."nexus-bench:status"]
description = "Report on the Nexus bench: pod, REST answer, upstream, descriptor drift, data set (reads the cluster, changes nothing)"
tools = { kubectl = "1.35" }
run = "go run ./internal/nexusbench/cmd/nexus-bench status"

[tasks."nexus-bench:record"]
description = "Regenerate the recorded Nexus fixtures from the bench (needs the bench up and its data set as described)"
run = "go run ./internal/nexusbench/cmd/nexus-bench record"

[tasks."nexus-bench:render"]
description = "Print the Nexus bench manifests for the current parameters (contacts nothing)"
run = "go run ./internal/nexusbench/cmd/nexus-bench render"

[tasks."nexus-bench:test"]
description = "Run the integration tests against a running Nexus bench (acts on the cluster; skipped when CI is set)"
tools = { kubectl = "1.35" }
# env as a table, not `env DEVDESK_NEXUS_BENCH=1 go test`: the same line then
# works under bash and under the cmd shell mise uses on Windows.
env = { DEVDESK_NEXUS_BENCH = "1" }
# -timeout 60m: go test stops at 10 minutes by default and the lifecycle test
# (DEVDESK_NEXUS_BENCH_LIFECYCLE=1) refuses to start with less than 45 left.
run = "go test -timeout 60m -count=1 -run Integration ./internal/nexusbench/..."

# The engine-vms:* tasks (OC-85, DEVDESK-795, tools/engine-vms/README.md) drive
# throwaway Incus VMs on the Incus host (default jakku.home.arpa, over SSH) in
# the dedicated project devdesk-engine-tests. They act on that host, are NOT part
# of ci, check, test or test-race, and nothing depends on them. Arguments go
# after `--`, e.g. `mise run engine-vms:reset -- podman n1`. The host, project,
# pool and network come from the DD_ENGINE_VMS_* variables (see lib.sh).

[tasks."engine-vms:create"]
description = "Create the Docker and Podman test VMs in the Incus project devdesk-engine-tests and take their clean snapshots (idempotent; acts on the Incus host)"
run = "bash tools/engine-vms/create.sh"

[tasks."engine-vms:verify"]
description = "Print the engine, kind and kubectl versions in the test VMs and fail if they differ from tools/engine-vms/versions.env (--smoke runs a container and a kind cluster)"
run = "bash tools/engine-vms/verify.sh"

[tasks."engine-vms:reset"]
description = "Restore a test VM to its clean snapshot, n or n1 (acts on the Incus host)"
run = "bash tools/engine-vms/reset.sh"

[tasks."engine-vms:destroy"]
description = "Delete the test VMs and the Incus project devdesk-engine-tests (asks first; acts on the Incus host)"
run = "bash tools/engine-vms/destroy.sh"
