apiVersion: apps/v1
kind: Deployment
metadata:
  name: three
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: three
  template:
    metadata:
      labels:
        app: three
    spec:
      containers:
        - name: web
          image: nginx:1.27
          securityContext:
            seccompProfile:
              type: RuntimeDefault
        - name: sidecar
          image: busybox:1.36
          securityContext:
            seccompProfile:
              type: Unconfined
        - name: bare
          image: busybox:1.36
