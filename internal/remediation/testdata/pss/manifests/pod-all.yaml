apiVersion: v1
kind: Pod
metadata:
  name: all
  namespace: demo
  annotations:
    container.apparmor.security.beta.kubernetes.io/app: unconfined
spec:
  hostIPC: true
  hostNetwork: true
  hostPID: true
  securityContext:
    sysctls:
      - name: kernel.shm_rmid_forced
        value: "1"
      - name: net.core.somaxconn
        value: "1024"
    seLinuxOptions:
      type: spc_t
    windowsOptions:
      hostProcess: true
  containers:
    - name: app
      image: nginx:1.27
      ports:
        - containerPort: 80
          hostPort: 8080
      securityContext:
        privileged: true
        allowPrivilegeEscalation: true
        runAsUser: 0
        procMount: Unmasked
        capabilities:
          add: ["SYS_PTRACE", "NET_RAW"]
      volumeMounts:
        - name: host
          mountPath: /host
  volumes:
    - name: host
      hostPath:
        path: /etc
