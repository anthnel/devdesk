apiVersion: batch/v1
kind: CronJob
metadata:
    name: nightly
    namespace: demo
spec:
    schedule: "0 3 * * *"
    jobTemplate:
        spec:
            template:
                spec:
                    securityContext:
                        seccompProfile:
                            type: RuntimeDefault
                    containers:
                        - name: report
                          image: busybox:1.36
                    restartPolicy: Never
