# Three containers, none sets a seccomp profile (F1).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: three
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: three
  template:
    metadata:
      labels:
        app: three
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      # the pod runs as the app user
      containers:
        - name: web
          image: nginx:1.27
        - name: sidecar
          image: busybox:1.36
        - name: bare
          image: busybox:1.36
