# Source: webapp/templates/deploy.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: release-name-web
spec:
  replicas: "two"
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
        - name: web
          image: web:1
