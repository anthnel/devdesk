apiVersion: v1
kind: Namespace
metadata:
  name: "nexus-bench"
  labels:
    app.kubernetes.io/managed-by: devdesk-nexus-bench
    app.kubernetes.io/part-of: devdesk-nexus-bench
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nexus-data
  namespace: "nexus-bench"
  labels:
    app.kubernetes.io/name: nexus
    app.kubernetes.io/managed-by: devdesk-nexus-bench
    app.kubernetes.io/part-of: devdesk-nexus-bench
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: "5Gi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus
  namespace: "nexus-bench"
  labels:
    app.kubernetes.io/name: nexus
    app.kubernetes.io/managed-by: devdesk-nexus-bench
    app.kubernetes.io/part-of: devdesk-nexus-bench
spec:
  replicas: 1
  # One ReadWriteOnce volume: the old pod must release it before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: nexus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexus
        app.kubernetes.io/managed-by: devdesk-nexus-bench
        app.kubernetes.io/part-of: devdesk-nexus-bench
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: nexus
          image: "docker.io/sonatype/nexus3:3.98.1"
          env:
            - name: INSTALL4J_ADD_VM_PARAMS
              value: "-Xms1g -Xmx1g -XX:MaxDirectMemorySize=1g -Djava.util.prefs.userRoot=/nexus-data/javaprefs"
          ports:
            - name: http
              containerPort: 8081
            - name: docker-group
              containerPort: 8082
          resources:
            requests:
              cpu: "500m"
              memory: "3Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          # UID and GID 200 are the nexus user of the image.
          securityContext:
            runAsUser: 200
            runAsGroup: 200
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: nexus-data
              mountPath: /nexus-data
          # Nexus takes minutes to start: wait up to 10 minutes (60 x 10 s).
          # There is no livenessProbe: a restart during the first start would loop.
          startupProbe:
            httpGet:
              path: /service/rest/v1/status
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /service/rest/v1/status
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: nexus-data
          persistentVolumeClaim:
            claimName: nexus-data
---
apiVersion: v1
kind: Service
metadata:
  name: nexus
  namespace: "nexus-bench"
  labels:
    app.kubernetes.io/name: nexus
    app.kubernetes.io/managed-by: devdesk-nexus-bench
    app.kubernetes.io/part-of: devdesk-nexus-bench
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: nexus
  ports:
    # REST API, UI and path routing.
    - name: http
      port: 8081
      targetPort: http
      nodePort: 30481
    # HTTP connector of the Docker group repository.
    - name: docker-group
      port: 8082
      targetPort: docker-group
      nodePort: 30482
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bench-upstream-data
  namespace: "nexus-bench"
  labels:
    app.kubernetes.io/name: bench-upstream
    app.kubernetes.io/managed-by: devdesk-nexus-bench
    app.kubernetes.io/part-of: devdesk-nexus-bench
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # Fixed: NEXUS_BENCH_STORAGE_SIZE sizes Nexus, not the upstream.
      storage: "1Gi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bench-upstream
  namespace: "nexus-bench"
  labels:
    app.kubernetes.io/name: bench-upstream
    app.kubernetes.io/managed-by: devdesk-nexus-bench
    app.kubernetes.io/part-of: devdesk-nexus-bench
spec:
  # The replica count is left out on purpose: kubectl scale owns it, so that
  # cutting the upstream and putting it back is not undone by the next apply.
  # One ReadWriteOnce volume: the old pod must release it before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: bench-upstream
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bench-upstream
        app.kubernetes.io/managed-by: devdesk-nexus-bench
        app.kubernetes.io/part-of: devdesk-nexus-bench
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: registry
          image: "docker.io/library/registry:3.0.0"
          env:
            # Distribution v3 exports traces by default; the bench has no collector.
            - name: OTEL_TRACES_EXPORTER
              value: "none"
          ports:
            - name: registry
              containerPort: 5000
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: upstream-data
              mountPath: /var/lib/registry
          readinessProbe:
            httpGet:
              path: /v2/
              port: registry
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: upstream-data
          persistentVolumeClaim:
            claimName: bench-upstream-data
---
apiVersion: v1
kind: Service
metadata:
  name: bench-upstream
  namespace: "nexus-bench"
  labels:
    app.kubernetes.io/name: bench-upstream
    app.kubernetes.io/managed-by: devdesk-nexus-bench
    app.kubernetes.io/part-of: devdesk-nexus-bench
spec:
  # Cluster-internal: Nexus reaches it by its DNS name, the host by a port-forward.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: bench-upstream
  ports:
    - name: registry
      port: 5000
      targetPort: registry
